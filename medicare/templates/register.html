{% extends "base.html" %}

{% block title %}Patient Registration – MediCare{% endblock %}

{% block content %}
<div class="container" style="max-width: 680px; padding-top: 30px; padding-bottom: 60px;">
  <div class="card">
    <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 14px; margin-bottom: 20px;">
      <h2 style="font-size: 20px; font-weight: 800; color: var(--slate-dark);">New Patient Registration</h2>
      <p style="font-size: 13px; color: var(--slate-muted); margin-top: 4px;">
        Register your permanent patient profile in the MediCare SQLite system. A unique Patient ID will be assigned automatically.
      </p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" name="name" id="name" class="form-control" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div class="form-group">
          <label for="age">Age *</label>
          <input type="number" name="age" id="age" min="1" max="120" class="form-control" placeholder="e.g. 29" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="gender">Gender *</label>
          <select name="gender" id="gender" class="form-control" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth *</label>
          <input type="date" name="dob" id="dob" class="form-control" value="1995-05-15" required>
        </div>

        <div class="form-group">
          <label for="blood_group">Blood Group *</label>
          <select name="blood_group" id="blood_group" class="form-control" required>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+" selected>O+</option>
            <option value="O-">O-</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" name="phone" id="phone" class="form-control" placeholder="+91 98765 43210" required>
        </div>

        <div class="form-group">
          <label for="emergency_contact">Emergency Contact *</label>
          <input type="tel" name="emergency_contact" id="emergency_contact" class="form-control" placeholder="+91 98765 00000" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="patient@example.com" required>
      </div>

      <div class="form-group">
        <label for="address">Residential Address *</label>
        <input type="text" name="address" id="address" class="form-control" placeholder="Street, City, State" required>
      </div>

      <div class="form-row" style="background: var(--slate-light); padding: 14px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 10px;">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="username">Create Username *</label>
          <input type="text" name="username" id="username" class="form-control" placeholder="e.g. rahul1" required>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label for="password">Create Password *</label>
          <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <div style="margin-top: 24px;">
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Complete Registration & Get Patient ID
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
