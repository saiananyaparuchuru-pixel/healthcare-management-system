{% extends "base.html" %}

{% block title %}My Profile – MediCare{% endblock %}

{% block content %}
<div class="container" style="max-width: 680px;">
  <div class="card">
    <div class="card-header">
      <div>
        <h2 class="card-title">Patient Profile Information</h2>
        <p class="card-subtitle">Permanent record loaded from the MediCare SQLite database.</p>
      </div>
      <span class="role-badge">ID: {{ patient.patient_id }}</span>
    </div>

    <form method="POST" action="{{ url_for('profile') }}">
      <div class="form-row">
        <div class="form-group">
          <label>Patient ID (Permanent)</label>
          <input type="text" class="form-control" value="{{ patient.patient_id }}" disabled style="background: var(--slate-light); font-family: monospace; font-weight: 700;">
        </div>

        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" name="name" id="name" class="form-control" value="{{ patient.name }}" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="age">Age *</label>
          <input type="number" name="age" id="age" min="1" max="120" class="form-control" value="{{ patient.age }}" required>
        </div>

        <div class="form-group">
          <label for="gender">Gender *</label>
          <select name="gender" id="gender" class="form-control" required>
            <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth *</label>
          <input type="date" name="dob" id="dob" class="form-control" value="{{ patient.dob }}" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="blood_group">Blood Group *</label>
          <select name="blood_group" id="blood_group" class="form-control" required>
            <option value="A+" {% if patient.blood_group == 'A+' %}selected{% endif %}>A+</option>
            <option value="A-" {% if patient.blood_group == 'A-' %}selected{% endif %}>A-</option>
            <option value="B+" {% if patient.blood_group == 'B+' %}selected{% endif %}>B+</option>
            <option value="B-" {% if patient.blood_group == 'B-' %}selected{% endif %}>B-</option>
            <option value="AB+" {% if patient.blood_group == 'AB+' %}selected{% endif %}>AB+</option>
            <option value="AB-" {% if patient.blood_group == 'AB-' %}selected{% endif %}>AB-</option>
            <option value="O+" {% if patient.blood_group == 'O+' %}selected{% endif %}>O+</option>
            <option value="O-" {% if patient.blood_group == 'O-' %}selected{% endif %}>O-</option>
          </select>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" name="phone" id="phone" class="form-control" value="{{ patient.phone }}" required>
        </div>

        <div class="form-group">
          <label for="emergency_contact">Emergency Contact *</label>
          <input type="tel" name="emergency_contact" id="emergency_contact" class="form-control" value="{{ patient.emergency_contact }}" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" name="email" id="email" class="form-control" value="{{ patient.email }}" required>
      </div>

      <div class="form-group">
        <label for="address">Residential Address *</label>
        <input type="text" name="address" id="address" class="form-control" value="{{ patient.address }}" required>
      </div>

      <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">
          Save Profile Changes
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
